[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbmmae"
version = "0.1.0"
description = "Reproducible PB-MMAE workflow for label-free geophysical-domain discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "rasterio>=1.3",
  "matplotlib>=3.8",
]

[project.scripts]
pbmmae = "pbmmae.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pbmmae = ["workflow/*.py"]
